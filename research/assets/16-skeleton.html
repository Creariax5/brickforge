<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Le squelette commun des BrickHeadz</title>
<style>
  :root { --bg: #f2f1ed; --panel: #fff; --fg: #1f1e1b; --muted: #6b665c; --line: #e2ded6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --panel: #1f1e1b; --fg: #ebe8e1; --muted: #a39e93; --line: #36332e; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar input[type=range] { width: 220px; }
  .muted { color: var(--muted); font-size: 12px; }
  .ramp { width: 140px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #f2d9c4, #e39a63, #c8501e, #7a2c0c); display: inline-block; vertical-align: middle; }
  #stage { position: relative; flex: 1; min-height: 380px; background: linear-gradient(#f4f2ee, #e7e3dc); }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .labs { position: absolute; inset: 0 0 auto 0; display: grid; grid-template-columns: 1fr 1fr; pointer-events: none; }
  .lab { padding: 8px 12px; color: #1f1e1b; } .lab b { display: block; } .lab span { font-size: 12px; color: #4b473f; }
  label { display: inline-flex; gap: 6px; align-items: center; }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="wrap">
  <div class="bar">
    <label>Seuil : présent dans au moins <b id="tv">70 %</b> des figurines <input type="range" id="t" min="10" max="95" value="70" step="5"></label>
    <span class="muted"><span class="ramp"></span> rare → toujours</span>
    <label><input type="checkbox" id="col"> couleur la plus fréquente</label>
    <span class="muted">Les deux vues tournent ensemble · glisser, molette</span>
  </div>
  <div id="stage"><div class="labs">
    <div class="lab"><b>Squelette en volume</b><span id="l1"></span></div>
    <div class="lab"><b>Squelette en pièces</b><span id="l2"></span></div>
  </div></div>
</div>
<script>
"use strict";
(async () => {
  const S = 1 / 20;
  const D = await (await fetch("16-skeleton.json")).json();
  const colors = await (await fetch("/api/ldcolors")).json();
  const parts = [...new Set(D.pieces.map((p) => p.part))];
  const r = await (await fetch("/api/parts-batch", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(parts) })).json();
  const f32 = (b64) => { const bin = atob(b64), buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); return new Float32Array(buf.buffer); };
  const geo = {}; for (const p of parts) if (r[p]) geo[p] = { t: f32(r[p].tris), e: f32(r[p].edges) };
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setScissorTest(true); renderer.outputEncoding = THREE.sRGBEncoding;
  stage.prepend(renderer.domElement);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
  const scenes = [0, 1].map(() => { const s = new THREE.Scene(); s.add(new THREE.HemisphereLight(0xffffff, 0x7d756a, 0.95));
    const a = new THREE.DirectionalLight(0xffffff, 0.55); a.position.set(15, 30, -20); s.add(a); const b = new THREE.DirectionalLight(0xffffff, 0.3); b.position.set(-20, 10, 25); s.add(b); return s; });
  const ramp = (f) => { const c = new THREE.Color(), stops = [[0, "#f2d9c4"], [0.4, "#e39a63"], [0.7, "#c8501e"], [1, "#7a2c0c"]];
    for (let i = 1; i < stops.length; i++) if (f <= stops[i][0]) { const t = (f - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]); return c.set(stops[i - 1][1]).lerp(new THREE.Color(stops[i][1]), t); }
    return c.set(stops[stops.length - 1][1]); };
  const edge = new THREE.LineBasicMaterial({ color: 0x1b1b1b, transparent: true, opacity: 0.28 });
  let roots = [null, null];
  function build(t) {
    // volume : cases pleines dans ≥ t des figurines (y vers le haut)
    const cells = D.cells.filter((c) => c[3] >= t);
    const g = new THREE.BoxGeometry(D.cx * S * 0.95, D.cy * S * 0.95, D.cx * S * 0.95);
    const m = new THREE.MeshStandardMaterial({ roughness: 0.6 });
    const im = new THREE.InstancedMesh(g, m, Math.max(1, cells.length));
    const o = new THREE.Object3D();
    cells.forEach((c, n) => { o.position.set((c[0] - D.c0 + 0.5) * D.cx * S, (c[1] + 0.5) * D.cy * S, (c[2] - D.c0 + 0.5) * D.cx * S); o.updateMatrix(); im.setMatrixAt(n, o.matrix);
      const col = ramp((c[3] - 0.1) / 0.9); col.convertSRGBToLinear(); im.setColorAt(n, col); });
    im.count = cells.length;
    // pièces : présentes dans ≥ t des figurines
    const ps = D.pieces.filter((p) => p.freq >= t);
    const realCol = document.getElementById("col").checked;
    let nt = 0, ne = 0; for (const p of ps) { const G = geo[p.part]; if (G) { nt += G.t.length; ne += G.e.length; } }
    const pos = new Float32Array(nt), cc = new Float32Array(nt), ep = new Float32Array(ne); let a = 0, ae = 0;
    for (const p of ps) {
      const G = geo[p.part]; if (!G) continue;
      const col = realCol ? new THREE.Color((colors[p.color] || {}).hex || "#999") : ramp((p.freq - 0.1) / 0.9); col.convertSRGBToLinear();
      const [x, y, z, A, B, C, Dd, E, Fm, Gg, H, I] = p.m;
      const put = (src, dst, off, cd) => { for (let k = 0; k < src.length; k += 3) { const vx = src[k], vy = src[k + 1], vz = src[k + 2];
        dst[off + k] = (A * vx + B * vy + C * vz + x) * S; dst[off + k + 1] = -(Dd * vx + E * vy + Fm * vz + y) * S; dst[off + k + 2] = (Gg * vx + H * vy + I * vz + z) * S;
        if (cd) { cd[off + k] = col.r; cd[off + k + 1] = col.g; cd[off + k + 2] = col.b; } } };
      put(G.t, pos, a, cc); a += G.t.length; put(G.e, ep, ae, null); ae += G.e.length;
    }
    const grp = new THREE.Group();
    const bg = new THREE.BufferGeometry(); bg.setAttribute("position", new THREE.BufferAttribute(pos, 3)); bg.setAttribute("color", new THREE.BufferAttribute(cc, 3)); bg.computeVertexNormals();
    grp.add(new THREE.Mesh(bg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.45, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
    const eg = new THREE.BufferGeometry(); eg.setAttribute("position", new THREE.BufferAttribute(ep, 3)); grp.add(new THREE.LineSegments(eg, edge));
    roots.forEach((rt, k) => rt && scenes[k].remove(rt));
    roots = [im, grp]; roots.forEach((rt, k) => scenes[k].add(rt));
    const typ = D.summary.cases_figure_mediane;
    document.getElementById("l1").textContent = `${cells.length} cases (une figurine typique en a ${typ}) · tête recalée sur sa base`;
    document.getElementById("l2").textContent = `${ps.length} pièces exactement à la même place (même pièce, même orientation)`;
  }
  const t = document.getElementById("t"), tv = document.getElementById("tv");
  t.oninput = () => { tv.textContent = t.value + " %"; build(t.value / 100); };
  document.getElementById("col").onchange = () => build(t.value / 100);
  t.value = 50; tv.textContent = "50 %"; build(0.5);
  const bb = new THREE.Box3();                                    // cadrage sur les cases (boîte des instances)
  D.cells.filter((c) => c[3] >= 0.5).forEach((c) => bb.expandByPoint(new THREE.Vector3((c[0] - D.c0) * D.cx * S, c[1] * D.cy * S, (c[2] - D.c0) * D.cx * S)));
  const ctr = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3()), R = Math.max(sz.x, sz.y, sz.z) * 2.4;
  controls.target.copy(ctr); camera.position.set(ctr.x - R * 0.45, ctr.y + R * 0.25, ctr.z - R * 0.85);
  const loop = () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (Math.abs(renderer.domElement.width / renderer.getPixelRatio() - w) > 1 || Math.abs(renderer.domElement.height / renderer.getPixelRatio() - h) > 1) renderer.setSize(w, h, false);
    const vw = w / 2; camera.aspect = vw / h; camera.updateProjectionMatrix(); controls.update();
    scenes.forEach((s, k) => { renderer.setViewport(k * vw, 0, vw, h); renderer.setScissor(k * vw, 0, vw, h); renderer.render(s, camera); });
    requestAnimationFrame(loop);
  };
  loop();
})();
</script>
</body>
</html>
