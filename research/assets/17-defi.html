<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Défi : la figurine en costume</title>
<style>
  :root { --bg: #f2f1ed; --panel: #fff; --fg: #1f1e1b; --muted: #6b665c; --line: #e2ded6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --panel: #1f1e1b; --fg: #ebe8e1; --muted: #a39e93; --line: #36332e; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  select, button { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
  .muted { color: var(--muted); font-size: 12px; }
  #row { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 420px; }
  #img { background: #d9d9d9; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #stage { position: relative; background: linear-gradient(#e2e2e2, #cfcfcf); }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .lab { position: absolute; left: 10px; top: 8px; color: #1f1e1b; pointer-events: none; } .lab span { font-size: 12px; color: #4b473f; display: block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="wrap">
  <div class="bar">
    <b>Version</b><select id="sel"></select>
    <button id="cam">Même angle que l'image</button>
    <button id="front">Face</button><button id="side">Profil</button><button id="back">Dos</button><button id="top">Dessus</button>
    <span class="muted" id="info"></span>
  </div>
  <div id="row">
    <div id="img"><img src="17-cible.jpeg" alt="Image cible (Gemini)"></div>
    <div id="stage"><div class="lab"><b id="t1"></b><span id="t2"></span></div></div>
  </div>
</div>
<script>
"use strict";
(async () => {
  const S = 1 / 20;
  const V = await (await fetch("17-defi.json?" + Date.now())).json();
  const colors = await (await fetch("/api/ldcolors")).json();
  const geo = {};
  const f32 = (b64) => { const bin = atob(b64), buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); return new Float32Array(buf.buffer); };
  async function loadGeo(parts) {
    const need = [...new Set(parts)].filter((p) => !(p in geo));
    if (!need.length) return;
    const r = await (await fetch("/api/parts-batch", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(need) })).json();
    for (const p of need) geo[p] = r[p] ? { t: f32(r[p].tris), e: f32(r[p].edges) } : null;
  }
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputEncoding = THREE.sRGBEncoding;
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.85));
  const l1 = new THREE.DirectionalLight(0xffffff, 0.75); l1.position.set(-8, 14, -10); scene.add(l1);
  const l2 = new THREE.DirectionalLight(0xffffff, 0.25); l2.position.set(10, 4, 8); scene.add(l2);
  const camera = new THREE.PerspectiveCamera(22, 1, 0.05, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
  const edge = new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.22 });
  let root = null, ctr = new THREE.Vector3(), R = 20;
  function mesh(list) {
    let n = 0, ne = 0; for (const p of list) { const g = geo[p.part]; if (g) { n += g.t.length; ne += g.e.length; } }
    const pos = new Float32Array(n), col = new Float32Array(n), ep = new Float32Array(ne); let o = 0, oe = 0; const c = new THREE.Color();
    for (const p of list) {
      const g = geo[p.part]; if (!g) continue;
      c.set((colors[p.color] || {}).hex || "#9a9a9a"); c.convertSRGBToLinear();
      const [x, y, z, a, b, cc, d, e, f, gg, hh, i] = p.m;
      const put = (src, dst, off, cd) => { for (let q = 0; q < src.length; q += 3) { const vx = src[q], vy = src[q + 1], vz = src[q + 2];
        dst[off + q] = (a * vx + b * vy + cc * vz + x) * S; dst[off + q + 1] = -(d * vx + e * vy + f * vz + y) * S; dst[off + q + 2] = (gg * vx + hh * vy + i * vz + z) * S;
        if (cd) { cd[off + q] = c.r; cd[off + q + 1] = c.g; cd[off + q + 2] = c.b; } } };
      put(g.t, pos, o, col); o += g.t.length; put(g.e, ep, oe, null); oe += g.e.length;
    }
    const grp = new THREE.Group();
    const bg = new THREE.BufferGeometry(); bg.setAttribute("position", new THREE.BufferAttribute(pos, 3)); bg.setAttribute("color", new THREE.BufferAttribute(col, 3)); bg.computeVertexNormals();
    grp.add(new THREE.Mesh(bg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.32, metalness: 0, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
    const eg = new THREE.BufferGeometry(); eg.setAttribute("position", new THREE.BufferAttribute(ep, 3)); grp.add(new THREE.LineSegments(eg, edge));
    return grp;
  }
  // l'avant de la figurine est vers −z ; l'image la montre de 3/4 avant-gauche, vue d'un peu au-dessus
  const views = { cam: [0.62, 0.42, -1.0], front: [0, 0.08, -1], side: [1, 0.08, 0], back: [0, 0.08, 1], top: [0, 1, -0.001] };
  const view = (v) => { camera.position.copy(ctr).add(new THREE.Vector3(...views[v]).normalize().multiplyScalar(R)); controls.target.copy(ctr); controls.update(); };
  async function show(i) {
    const v = V.versions[i];
    await loadGeo(v.placed.map((p) => p.part));
    if (root) scene.remove(root);
    root = mesh(v.placed); scene.add(root);
    const bb = new THREE.Box3().setFromObject(root); bb.getCenter(ctr); const s = bb.getSize(new THREE.Vector3()); R = Math.max(s.x, s.y, s.z) * 3.4;
    document.getElementById("t1").textContent = v.title;
    document.getElementById("t2").textContent = v.sub;
    document.getElementById("info").textContent = `${v.check.pieces} pièces · ${v.check.floating ? v.check.floating + " volent" : "rien ne vole"} · ${v.check.collisions ? v.check.collisions + " collisions" : "aucune collision"}`;
    if (!show.done) { view("cam"); show.done = true; }
  }
  const sel = document.getElementById("sel");
  V.versions.forEach((v, i) => { const o = document.createElement("option"); o.value = i; o.textContent = v.title; sel.append(o); });
  sel.value = V.versions.length - 1;
  sel.onchange = (e) => show(+e.target.value);
  ["cam", "front", "side", "back", "top"].forEach((k) => document.getElementById(k).onclick = () => view(k));
  await show(V.versions.length - 1);
  const loop = () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (Math.abs(renderer.domElement.width / renderer.getPixelRatio() - w) > 1 || Math.abs(renderer.domElement.height / renderer.getPixelRatio() - h) > 1) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
    controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
  };
  loop();
})();
</script>
</body>
</html>
